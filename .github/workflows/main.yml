name: Arslanlar Bot 7-24 Sunucu

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Depodaki kodlari cek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneleri yukle
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu Calistir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_CREDENTIALS }}
          PORT: 10000
        run: |
          timeout 330m python bot.py || true
